services:
  api:
    build: ./server
    container_name: rukn-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      # Persist the SQLite database and uploaded gallery images across
      # container restarts/rebuilds — without these, redeploying wipes them.
      - rukn-data:/app/data
      - rukn-uploads:/app/uploads

volumes:
  rukn-data:
  rukn-uploads:
